# 试玩接口（前缀匹配：/api/tank/new、/poll、/send、/close、/mine、/stats）
#
# 两点经验：
#   1. 轮询比较密（0.7s 一次），这里**不要**加 limit_req，否则正常玩法会被拦；
#      限流交给应用层（并发 4、单人 1 局、输入限速）。
#   2. X-Real-IP 必须传 —— 应用按它做"一个出口最多 3 局"，没它就只能靠访客 id。
location /api/tank/ {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}

# 生成的页面（python web/standalone.py > /var/www/site/tank/index.html）
location = /tank/ {
    alias /var/www/site/tank/index.html;
}